name: Keep Render Backend Alive

on:
  schedule:
    # Runs every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch: # allows manually triggering it from the Actions tab too

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend /auth/me endpoint
        run: |
          curl -s -o /dev/null -w "%{http_code}" https://officeassist-backend.onrender.com/auth/me
